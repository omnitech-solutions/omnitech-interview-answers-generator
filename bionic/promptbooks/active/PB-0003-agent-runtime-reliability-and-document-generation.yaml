format_version: '1'
id: PB-0003
title: 'Cycle: Agent runtime reliability and measured document generation'
status: active
created_at: '2026-10-03'
total_prompts: 21
current_run: RUN-001
current_prompt: 7
forked_from: null
tags:
- cycle
- workflow
- feature
- agent-runtime
- documents
- interview
cycle_kind: adr
modules:
  adrs: 2
  dev_loops: 2
  review_cycles: 1
goal: |
  Outcome: Interview Studio generates reliable agent results and progressively usable, grounded interview documents with measured latency improvements across Codex and Claude. Evidence: each runtime execution emits exactly one terminal outcome; supported session, streaming, structured-output, cancellation, recovery, and concurrency behavior is proved against the installed TypeScript SDKs and pinned protocol; the same resume, template, and matrix are benchmarked with one, three, and five model groups, with before-and-after latency, cost, and visible-field timings recorded; revision and retry tests show that stale or partial results cannot overwrite newer or authoritative data; pnpm verify and an independent full-cycle review pass. Constraint: preserve AgentRuntimeAdapter and existing agent-worker isolation, profile bounds, subscription-style local authentication, tenant privacy, no content logging, direct-source document fields, and current generation contracts; do not invent candidate facts, introduce generic workflow infrastructure, change credentials, or make external sends, pushes, merges, or spend without task-specific authorization. The end state is a reviewed, tested, documented PR draft ready for human delivery.
strategy: |
  Plan two architectural decisions, then implement the two accepted slices: runtime lifecycle/transport and document generation. Run the independent full-cycle review only after both implementation loops. Close every MUST-FIX finding and record unobserved provider and real-workload behavior explicitly.

  First inspect current code and measure a baseline. The original architectural proposal is a candidate design, not an implementation mandate: the Codex adapter currently uses @openai/codex-sdk, the installed TypeScript Claude Agent SDK exposes query() rather than a named ClaudeSDKClient, and the document path already has direct fields, grouping, bounded calls, and validated batch progress. Establish the remaining gaps before adding new layers. Verify any version-sensitive vendor claim against the installed packages and official docs.

  Use the template council, three-round escalation, quality gates, independent reviewers, security review, documentation audit, journal, PR draft, and archival. No execution or external side effect begins merely because this book was authored.
run_autonomy: |
  Once this cycle's run is started, it runs to completion without human
  review. Questions and decisions are resolved by the `council` skill and
  dispatched `Agent`s; help comes from skills and tools. As long as the
  prompts are followed and the cited ADRs are respected, no human is
  involved. The only stops are (a) a module escalation loop firing (3-round
  non-convergence on council, quality gates, or review fix-loop) and (b) a
  genuinely irreversible/outward-facing action the plan did not authorize
  (push/merge, deploy, external send, data deletion, spend). In-repo edits —
  including `bionic/AGENTS.md`, skill files, and code — are never stop points.
  See `docs/AGENTS.md` §11 (resolved in this repository as `bionic/AGENTS.md` §11) "Run execution autonomy" for the full contract
  (authoritative).
prompts:
- title: 'Plan #1: spawn planning team, propose ADR for agent runtime lifecycle, transport,
    and terminal-event semantics'
  module_tag: adr-1
  purpose: |
    Establish the architectural commitment before any code lands.
  prompt: |
    Read the cycle's Goal and any prior Accepted ADRs in this cycle. Invoke
    `query-docs` to surface existing ADRs, briefs, or research sources
    relevant to agent runtime lifecycle, transport, and terminal-event semantics. Then dispatch 2–3 planning agents in parallel
    via the `Agent` tool. Each agent reads the affected code paths and
    returns a one-page proposal: problem statement, options considered (≥2),
    recommendation, risks, open questions.

    Synthesize the proposals into a single recommendation. Then invoke the
    `propose-adr` skill with the synthesized content. The ADR must contain:
    Context, Decision, Alternatives Considered (≥2), Consequences,
    References (linking to any related ADRs/briefs/research via wiki-links).
    Status starts at `Proposed`.

    Record the ADR id (`ADR-NNNN`) in this run snapshot's Artifacts field
    under the label `ADR #1`, and beside it the ADR's rule citations — one
    `rule:<slug>` per `governs` entry, the slug being the part of the handle
    after the slash. The id is the machine field the accept prompt reads;
    the citations are what the dev and review modules implement and check.

    Then run the rule-length advisory and read its `warnings` list:

      uv run "${CRUX_PLUGIN_ROOT}/scripts/check-governs-coverage.py" --repo-root <repo-root>

    A row naming this ADR means a `governs` rule is longer than the recommended
    maximum; the row carries the handle, the length, that maximum, and the
    guidance for shortening it. It is ADVISORY: it changes no exit code and
    blocks nothing.

    The principle it serves is `bionic/AGENTS.md` §11.D rule 7 — read it there;
    this prompt names it and does not restate it. Either shorten the rule as
    that rule and the row's own message direct, or say in this prompt's Result
    why the length is what precision costs here. Do not truncate a rule to
    clear a row. Saying so in the Result is a note in an existing free-text
    field, not a waiver: there is no waiver field to fill and no approval step
    to pass.

    For this ADR, inspect packages/agent-runtime-contracts, packages/agent-runtime-codex, packages/agent-runtime-claude, and apps/agent-worker. Establish the exact terminal-event invariant and whether cancellation is a distinct event or a failed event with a cancelled code; test the Codex turn.failed then completed defect. Evaluate long-lived Codex App Server against the current SDK on installed versions: protocol generation/pinning, handshake, structured output, stream ordering, interrupt, thread resume, process ownership, backpressure, and bounded concurrency. Evaluate supported persistent TypeScript Claude Agent SDK query/session mechanisms; do not assume the Python ClaudeSDKClient symbol exists in TypeScript. Include a measured one-shot baseline, failure and recovery behavior, and an explicit migration/fallback decision. Preserve agent-worker isolation and current auth; do not modify credentials. Cite official vendor documentation and installed API definitions, with version and date.
  expected_output: |
    ADR file at `bionic/adrs/ADR-NNNN-<slug>.md` with `status: Proposed`;
    `manifest.yml`'s `adr.next_number` incremented; `bionic/log.md` entry
    appended.
  side_effects:
  - propose-adr
  - query-docs
  n: 1
- title: 'Plan #1: convene LLM council to review the ADR'
  module_tag: adr-1
  purpose: |
    Gate the ADR with multi-perspective review before acceptance.
  prompt: |
    Invoke the `council` skill (multi-model: Claude + Gemini + GPT, async)
    — or, equivalently, dispatch 5 parallel review agents via the `Agent`
    tool — each owning one quality dimension:
      (1) Completeness — are Context/Decision/Alternatives/Consequences
          all fleshed out? Any missing references?
      (2) Correctness — does the proposal actually solve the problem?
          Are the assumptions verifiable?
      (3) Consistency — does this conflict with any prior `Accepted` ADRs
          (INCLUDING any ADRs accepted earlier in this cycle), briefs, or
          invariants in `bionic/AGENTS.md`?
      (4) Clarity — would a new engineer (or future Claude) understand the
          decision from this ADR alone?
      (5) **Security** — does the decision introduce a security risk?
          Evaluate: new attack surface or trust boundary; secret/credential
          handling (does it touch `~/.crux/`, env vars, or log values?);
          injection or authz implications; supply-chain exposure (new
          dependency, external fetch, or unpinned source). Return
          `REQUEST_CHANGES` if the ADR creates a security risk it does not
          explicitly mitigate.

    Each agent must read: the proposed ADR, `bionic/adrs/index.md`, and any
    code paths or ADRs the proposal cites. Each returns a verdict
    (`APPROVE` / `APPROVE_WITH_NITS` / `REQUEST_CHANGES`) plus a numbered
    findings list.

    Aggregate verdicts and route by exactly one of three cases:
      - **Clean consensus** — ALL five `APPROVE`, zero findings → advance to
        this module's accept prompt.
      - **Minor nits only** — one or more `APPROVE_WITH_NITS` on
        NON-safety-adjacent dimensions (Completeness, Clarity, or a
        stylistic Consistency/Correctness nit), with NO `REQUEST_CHANGES`
        and NO safety-adjacent dissent → advance directly to this module's
        address-findings prompt (address the nits, re-convene). **No deeper
        review** — a lone nit does not warrant the srde/deep-architecture pass.
      - **Split verdict → deeper architectural review** (the case below).

    **Deeper architectural review (auto-trigger, autonomous — part of the
    hardened cycle contract).** A **split verdict** is,
    operationally, ANY of: (i) any dimension returns `REQUEST_CHANGES`;
    (ii) any `APPROVE_WITH_NITS` or dissent on a *safety-adjacent* dimension
    (Security, or a Correctness dissent alleging a real defect rather than a
    stylistic gap); (iii) the dimensions return verdict tokens spanning more
    than one level AND at least one is `REQUEST_CHANGES` (a pure
    APPROVE/APPROVE_WITH_NITS mix is "minor nits only" above, NOT a split).
    On a split, deepen the review before looping, WITHOUT involving a
    human: (a) collect the per-dimension dissents; (b) run the `srde` skill
    to resolve dissents answerable from existing in-repo bionic/probes (resolved
    → drop). **`srde` auto-drop is excluded for safety-adjacent dissents** —
    Security, and Correctness dissents alleging a real defect, are NEVER
    silently auto-resolved; they always route to (c) or the findings loop.
    (c) For dissents `srde` cannot resolve, dispatch ONE dedicated
    deep-architecture-review `Agent` that reads the full ADR graph
    (`bionic/adrs/index.md`, every cited ADR, `bionic/AGENTS.md` invariants) and
    renders a binding architectural verdict **using the same vocabulary as
    the council** (`APPROVE` / `APPROVE_WITH_NITS` / `REQUEST_CHANGES` + a
    findings list); its surviving findings → the address-findings prompt like
    any other. The `srde`/deep-review probes are read-only over in-repo
    content: they MUST NOT run untrusted code, fetch unpinned external
    content, or read/expose secret values. The `--deep-review` flag (if the
    book was authored with it) forces steps (a)–(c) on round 1 regardless of
    verdict.
  expected_output: |
    Aggregated 5-dimension council verdict; srde/deep-review resolution if
    the verdict split; findings list (if any).
  side_effects:
  - council
  - srde
  n: 2
- title: 'Plan #1: address council findings, re-convene the council'
  module_tag: adr-1
  purpose: |
    Close the planning loop until the council approves.
  prompt: |
    For each finding from the council (this module's council prompt), edit
    the proposed ADR in place to address it. Do NOT change `status:` — the
    ADR remains `Proposed` throughout this loop. Preserve the body structure
    (Context / Decision / Alternatives Considered / Consequences /
    References).

    Resolve findings **autonomously** — use the council/`srde` outputs and
    dispatched `Agent`s; do NOT ask a human.

    A revision lengthens a rule as easily as it shortens one, so re-run the
    advisory before the next round and read its `warnings` list again:

      uv run "${CRUX_PLUGIN_ROOT}/scripts/check-governs-coverage.py" --repo-root <repo-root>

    Handle any row naming this ADR exactly as the drafting prompt says: shorten
    it per `bionic/AGENTS.md` §11.D rule 7, or say in this prompt's Result why the
    length is necessary. Advisory throughout — it never blocks the round.

    When every finding is resolved,
    return to this module's council prompt to re-convene the council. After
    3 full loops without convergence, STOP and escalate to the user — a
    genuine fundamental disagreement (not a resolvable finding) is the only
    thing that warrants human adjudication.
  expected_output: |
    Updated ADR; control returns to this module's council prompt.
  side_effects: []
  n: 3
- title: 'Plan #1: accept the ADR'
  module_tag: adr-1
  purpose: |
    Commit to the plan; freeze the body.
  prompt: |
    Invoke `transition-adr` with: `accept ADR-NNNN` (where `NNNN` is the
    id recorded in this run snapshot's Artifacts under `ADR #1`). This
    sets `status: Accepted`, stamps `accepted_at:`, and writes both the
    `adr | accept` log entry and the index update.

    Then invoke `log-work` to append a journal entry summarizing this
    ADR's planning loop: number of council rounds, the key debate(s) that
    shaped the final decision, and any open questions deferred to later
    phases. Per the journal contract, name at least one thing that didn't
    work on the first attempt or surprised the reviewers.
  expected_output: |
    ADR at `status: Accepted`; new entry under `bionic/journal/YYYY-MM.md`.
  side_effects:
  - transition-adr
  - log-work
  n: 4
