- n: 9
  title: 'Develop #1: derive an implementation plan for slice 1 foundation: the active-session-contracts package; products/interview live-session/core (observation ordering, dedup, task revisions, leases and fencing, stop authority) importing only neutral contracts; the repository and Drizzle migration with actor-level forced RLS; the session processor exported through the product''s public entrypoint and registered in apps/agent-worker as a separately bounded loop; authenticated ingest, stream and control routes with a short-lived credential bound to tenant, actor and session; and the locality policy gate'
  module_tag: dev-1
  purpose: |
    Convert the architectural commitment(s) into ordered work units.
  prompt: |
    Read the rules this loop implements: the rule: citations of every ADR accepted in this cycle. Resolve each citation
    through `docs/adrs/doctrine/index.md` to its rule and its ADR; read the
    ADR for the rationale. Produce an implementation plan scoped to slice 1 foundation: the active-session-contracts package; products/interview live-session/core (observation ordering, dedup, task revisions, leases and fencing, stop authority) importing only neutral contracts; the repository and Drizzle migration with actor-level forced RLS; the session processor exported through the product's public entrypoint and registered in apps/agent-worker as a separately bounded loop; authenticated ingest, stream and control routes with a short-lived credential bound to tenant, actor and session; and the locality policy gate
    with:
      - Files to create / modify (paths)
      - Ordered work units (each ≤ ~200 LOC; each independently testable)
      - Risks specific to implementation (not architecture)
      - Quality gates: which tests, which linters, which static-analysis
        and security tools must pass before review.

    The plan is a working document — capture it in this run snapshot's
    Notes field under the label `Implementation plan #1`. Do NOT write a
    separate ADR for the implementation plan; the architectural decision
    is already recorded.
  expected_output: |
    Implementation plan in this run's Notes; clear ordered work units.
  side_effects: []
- n: 10
  title: 'Develop #1: spawn implementation team'
  module_tag: dev-1
  purpose: |
    Implement the plan with parallel agents where independent.
  prompt: |
    Group the work units from this loop's planning prompt by independence.
    Dispatch one `Agent` per independent group in parallel. Each agent
    receives: the ADR(s), the implementation plan, its assigned work units,
    and explicit conventions from `docs/AGENTS.md`.

    Each agent also receives the book's `goal` statements — the Outcome, the
    Evidence, and the Constraint. A dispatch passes them forward verbatim, or
    narrows the Outcome and says so: a narrowed Outcome is entailed by its
    parent and names the parent it narrowed and what it dropped. The Evidence
    and the Constraint pass whole — a dispatch may add an Evidence item or a
    Constraint, saying which it added, and may drop neither. Record any
    narrowing in this run snapshot's Notes under the label
    `Outcome narrowing #1` — never by editing the book.

    Each agent must make actual edits and run the relevant tests for its
    scope. Each returns: files changed, tests added/updated, test results,
    and any unilateral decisions with rationale.

    After all agents return, integrate. If two agents edited overlapping
    files (they should not have, given grouping), reconcile manually.
  expected_output: |
    All work units implemented; per-agent reports collected.
  side_effects: []
- n: 11
  title: 'Develop #1: run quality gates; loop until clean'
  module_tag: dev-1
  purpose: |
    Verify the implementation passes every gate before review.
  prompt: |
    Run, in this order:
