  ## Implementation plan #4 (Develop #4, prompt 21): capture companion, fixture companion, operational hardening (slices 1-3)
  Rules implemented (ADR-0011, ADR-0012): rule:versioned-wire-contract, rule:identity-from-credential, rule:credential-ingest-scope, rule:credential-storage, rule:idempotent-observation, rule:stop-authority, rule:fast-path-no-tools (unchanged), rule:no-undetectability-or-evasion, rule:no-external-interface-operation, rule:bounded-ingest, rule:id-only-traces, rule:raw-audio-never-persisted, rule:locality-by-stage (transcription only in the companion with OS on-device recognition and a visible capability check), rule:credential-lifetime-and-renewal (owner renews). Mission/objectives: bionic/objectives.md (OBJ-1, OBJ-3, OBJ-4, OBJ-5 private, OBJ-6 reusable).

  Facts found while planning (contradicting the loop-4 assignment's premises, recorded not hidden):
  - The generated JSON Schema and the valid/invalid corpus the assignment says dev loop 1 produced DO NOT EXIST (packages/active-session-contracts has zod sources and unit tests only). U1 creates them; everything downstream consumes them.
  - Pairing today is the owner copying the one-time credential from Studio (PairingPanel). There is no pairing-code exchange route and ADR-0012 forbids a URL carrying the credential and a device binding; U-pairing keeps paste-in with Keychain storage (decision D3 below) rather than adding server state.
  - No pre-start channel exists from the companion to Studio: the only companion credential is minted at session start, and ADR-0012 rules out a standing device credential. So a capability report can arrive only after pairing; Setup blocks from the owner's LAST report (decision D5), and the first session of a Mac is blocked visibly by the companion itself.
  - The toolchain: Swift 6.2.3 (swift build/test available), CLT only (no xcodebuild); the macOS SDK carries ScreenCaptureKit, Speech, Security, AVFoundation headers, so the framework adapters can be COMPILED (not run) with `swift build`; an .app bundle with Info.plist/entitlements and any permission prompt cannot be produced or observed here.
  - Boundary: the boundary test forbids importing an apps/* package; products/interview conformance tests need the TS fixture companion, so U-boundary adds one narrow exception (test files in products/interview may import @omnitech/capture-companion/fixture, a dev dependency) and a rule that capture-companion non-test code imports only active-session-contracts (plus a Swift source scan: only Foundation, Security, ScreenCaptureKit, Speech, AVFoundation, CoreMedia, CoreImage, ImageIO, Dispatch, os; no database/provider/credential strings).

  Decisions:
  - D1 Wire change is additive within WIRE_VERSION 1 (no bump; ADR-0011 forbids only unknown versions/kinds): transcript.final.content gains optional `source` ('microphone' | 'application-audio'), always sent by the companion, checked at ingest against the session's permitted sources (closes dev loop 1 deferral F6; `speaker` stays a source label, equal to the source); new ingest-only message `capability.report` (content-free: speech locale, on-device availability, permission states); new refusal code `event_conflict`; new limit minHeartbeatIntervalMs (closes F7 for heartbeats; refused/invalid messages store nothing and stay unbounded by design, recorded).
  - D2 Same source and event id with DIFFERENT content is refused `event_conflict` (409) and never overwrites; identical content is a duplicate returning the original ack.
  - D3 Pairing: paste the Studio pairing credential plus the Studio address and workspace slug (Studio's pairing panel shows all three) into the companion; stored in the macOS Keychain (kSecClassGenericPassword, this-device-only accessibility), loaded into memory, sent only as `Authorization: Bearer`, never in a URL, never logged; renewal is owner-initiated in Studio and the owner pastes the replacement (the companion never renews itself); a credential_refused answer stops capture visibly and keeps nothing.
  - D4 Control pull = the heartbeat loop: the companion reads `control.state` from every ack and refusal. pause/ended/purging stop capture and drop buffered audio; resume (state active after a pause) restarts only sources the user selected locally and that Studio has not refused (narrowing only: a refused source is dropped for the run, never retried, surfaced visibly). LOCAL STOP is local-first: synchronous, no network, stops capture, zeroes buffers, persists a 'stopped locally' marker, then best-effort queues source.disconnected(user-stopped) and heartbeat capturing:false; a local stop is final for the run (no auto-resume).
  - D5 Speech is ALWAYS on-device in the companion (requiresOnDeviceRecognition = true) whatever Studio's policy, so Setup copy 'Speech recognition still runs on this Mac' is true; the capability check (locale supported, on-device supported, recognizer available, authorised) fails VISIBLY: no audio source starts, heartbeat capturing:false pauses the session, capability.report says why. Studio stores the owner's latest report in a small owner-scoped table (one migration, forced RLS, tenant+owner composite) and exposes GET .../sessions/companion-capability; Setup derives a device-only blocker from it ('English (UK) is not available on-device on this Mac'); Sources tab shows the companion's speech state.
  - D6 Screenshot policy (companion): selected window/display only, downscale + JPEG/PNG compression under maxScreenshotBytes, meaningful-change gate (perceptual hash distance over a threshold AND minimum interval), hard per-session cap from the contract constants, never every frame, never persisted locally.
  - D7 Raw audio: bounded in-memory ring buffer (seconds-capped), dropped on pause, stop, revocation and credential expiry, never written to disk; capture.gap(buffer-overflow) when it overflows.
  - D8 Batched idempotent send: each observation gets a stable (sourceId, eventId) assigned at creation (monotonic sequence per source), kept in a bounded in-memory outbox until acknowledged (accepted or duplicate); resend after reconnect uses the SAME ids; exponential backoff with jitter; rate_limited honours Retry-After; permanent refusals (credential_refused, session_ended, session_purging, invalid_observation, envelope_too_large) drop the message and surface; outbox overflow records capture.gap.
  - D9 Companion UI strings are claims this loop makes true or changes: 'stops locally if Studio is unavailable' -> companion local-stop tests (Swift StopController + TS fixture 'studio down' test); 'can't add sources' -> wire has no way to broaden (schema test) + server refusal of an unpermitted source (ingest test) + companion narrowing test; 'Speech: on this Mac, in the companion' -> capability check requiring on-device and the egress boundary test (no network type in the speech adapter; fixture capability-unavailable test).

