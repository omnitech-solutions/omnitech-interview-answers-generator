  ## Dev loop #3 implementation reports (prompt 18)
  Delegates (all foreground, shared worktree, disjoint files): U1 browser contract + backend reads, U2 apps/web ingest forwarding (parallel); U3 foundation; then U4 session bar, U5 setup, U6 live view, U7 ended view, U8 Workspace hand-off, B3 withheld-claim record (parallel); then U9 integration and audit. Commits: f59ea00 (browser contract in packages/interview-contracts), 6777a1d (list sessions, setup choices, action change cursor + serverNow), 928193c (interview.live manifest route, no new permission), 28e036e (ingest test), 86a53f3 a6dcb24 3bdd1f8 52008f2 21e7ef8 (icons, route and nav, client and module-level store, view-model derivation, shell wiring), 5b7b535 efdf118 6ca4092 92a154a (session draft in the existing Workspace), 4bda9c6 (setup, pairing, session bar, ended view and the B3 backend files; swept together because of a shared index and a repo-wide pre-commit format check), 1e306c5 14a2923 c178214 (live view), 28ec31e 6484e4d 3299f8a e1c8f72 5ad277c 8e9316b 505227d (integration).
  Findings and decisions: U2 verdict FORWARDED (no Next middleware; one Hono catch-all; ingest handler authenticates by credential; 7 tests, mutation check 6 of 7 fail on a cookie-requiring shell middleware); no new permission (interview.read for the live route; start/resume/renew need write, owner stop actions need read). Action stream reads every action created or changed after an opaque (updated_at, id) cursor with a 2 s overlap (merge by id, newest updatedAt wins), closing loop-1 deferral F5. B3: a draft withheld by claim verification now carries a content-free {withheld:{rejectedClaimCount, codes}} (carried on suppression_reason, no migration; the result column is legal only on succeeded actions), so the UI says how many claims failed checking without ever showing claim text. U8 found and fixed a backend defect: reading a missing session draft created a placeholder draft that made the session's publish hold its result. Store is module-level per tenant (hydrate from /current, one poll loop 1 s active / 5 s paused, visibility pause, survives navigation); server clock offset gives elapsed. Hard-guarantee strings checked: dropped "renews every 10 min" (credential lasts up to 2 h, owner renews), "512 MB / 10 s" (runner: 256 MB, 1 CPU, 20 s, read-only, no network), "no host folders mounted" (a per-run temp source dir is mounted), raw-audio persistence toggle (static "Memory only"), "Capture companion connected" before contact, "If something can't, the session won't start" (device-only refusals happen at dispatch), "nothing is running" after End; each is covered by guarantee-strings.test.tsx. Three states generated / tests passed / fully verified are kept distinct. Rehearsal: the scorecard save now sends the live session's rehearsalRunId (closes loop-2 deferral F10 on the client side; limit: only for a rehearsal session started from Setup).
  Gaps recorded, not claimed: no per-task source link, assumptions list or employer text on matrix chips (results do not carry them; chips show Role N, revision and verbatim quote); the design's "English (UK) not available on this Mac" is a companion capability report that does not exist until loop 4 (the blocking-error component is built and tested with an injected blocker, none is wired); no pre-start device capability probe route (the worker, not the web process, knows its device profiles).

