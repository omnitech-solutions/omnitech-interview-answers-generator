  Existing facts the plan builds on (verified): the session row pins the candidate profile id+revision (and optionally a candidacy, interview and one linked Workspace draft) at start and the privacy columns are immutable; fenced-writes.ts owns recordAction/readDispatchStanding/publishResult/abandonAction/recordFailure/createSessionJob and the session-owned draft purge hook (SessionDraftPurger, default no-op) exists; assist-stage.ts is a baseline stage (suggested-interpretation and general-knowledge only, no matrix claims); briefing/api.ts already holds the matrix-leaf citation model (pointer, sha256, quote, sourceKind candidate | employer-context | candidate-preference) and briefing/selection.ts the role ranking; assistant/workspace.ts InterviewWorkspaceRepository holds drafts with optimistic revision (editTransaction refuses a stale expected revision) and a strict provenance object a user edit clears; packages/code-runner DockerCodeRunner already runs with --network none, --memory, --cpus, --pids-limit, --read-only, tmpfs, no-new-privileges and only per-run temp-file mounts.

  Decisions (made here; no ADR, the architecture is already recorded):
  D1 One structured call classifies and answers. The closed output carries a category (background, motivation, technical-concept, experience-story, leadership-behavioural, logistics, leaving-role, questions-to-ask, coding, other), the spoken draft, claims, and for leadership-behavioural a STAR object (situation, task, action, result each with its claims) and for logistics the fields found and the fields missing. No tool, locality, privacy, retention, credential or profile field exists in the schema (unknown keys are violations, counted not copied).
  D2 Claim kinds: matrix-backed (needs 1+ refs to an entry of the pinned snapshot: source id, pinned revision, pointer, verbatim quote), preference-backed (a ref to a candidate-preference entry; the only source of notice period and compensation), suggested-interpretation (the candidate's own motive or opinion, never a fact; carries no figure and no refs), general-knowledge (technical, no personal fact, no figure of the candidate), not-in-matrix (an affirmation the approved revision does not contain: labelled, never promoted). A ref must (1) name an entry in the snapshot with the pinned revision and hash, (2) quote it verbatim, and (3) SUPPORT the claim: every figure of the claim appears in the cited quotes and the claim shares enough content with them. A ref to an existing entry that does not support the claim is REJECTED (violation code unsupported_reference, by path). Any rejected claim suppresses the whole draft (fail closed, id-only trace, retried only by the existing bounded retry); nothing is published.
  D3 Spoken-aloud figures: a figure in a non-matrix section that appears in the captured text and not in the cited sources is rejected (hazard 7b). Leaving-role drafts: employer names and dates only as matrix-backed claims, the reason only as a candidate-input-needed item, never a generated claim; a small disparagement lexicon rejects any draft that disparages an employer (7c). Logistics: figures only from preference-backed claims; absent preferences are listed as missing and the draft states what to supply (7d). 7a: an affirmation the matrix lacks is a not-in-matrix section; promotion is structurally absent (no matrix or catalogue writer is reachable from live-session; a test scans imports and a database test proves matrix and catalogue rows unchanged).
  D4 service.ts is the session assistance service: it owns context assembly (pinned snapshot, bounded and cached per run), the answer stage, claim verification, the coding path and the escalation decision, behind one function the dispatcher calls; interview-policy.ts keeps task identity and gains category routing helpers and the leadership/behavioural and logistics outcome shapes; session-dispatch.ts stays the fenced record/standing/publish skeleton.
  D5 Context snapshot: loaded through the store port in an owner-scoped transaction (rule:owner-checked-read-paths) from the session row's pinned profile id and revision (hash re-verified), plus the linked briefing draft's context when one is linked: job description and employer notes and research are UNTRUSTED employer-context observations (labelled blocks, never policy), candidatePreferences is the one candidate-preference source. Bounds: 40 sources, 400 chars each, 5,000 chars total (device profile 2,500). The snapshot pins {profileId, revision, sha256}; the draft revision read is recorded.
  D6 Coding path: the draft-answer result with category coding schedules a SECOND action kind (solve-code) for the same task revision, so the prose draft never waits on coding. solve-code (permitted-remote only; refused in device-only: coding inference has no device profile) makes one direct structured model call (code, tests, language typescript or react, escalation none | repository-navigation | iterative-repair), runs the tests through the injected CodeRunner (runAll), and publishes inside the fenced publish transaction to a session-owned Workspace draft (workspace id active-session:<sessionId>, artifact id from the task id, provenance mark proposalId session:<sessionId>) with an expected-revision check: if the owner edited the draft since the session last wrote it, the result is NOT written to the draft, it stays on the action as a held result and the conflict is reported. States are distinct and recorded separately: generated (a structured solution validated and published), tests-passed (runner exit 0, not timed out, at least one test, all passed), fully-verified (tests-passed AND every currently stated constraint is covered by a named passing test AND syntax check clean). A new task revision (changed constraint) marks the earlier solution stale and regenerates; the stale result is never published (existing fenced eligibility).
  D7 Agent job only on a validated structured escalation field (repository-navigation or iterative-repair, the latter only after one direct repair attempt failed its tests), only in permitted-remote, created through createSessionJob after the action row reserves the job id (action-before-job), cancelled by pause/end (existing). No raw CLI arguments, environment variables, directories, MCP servers or permission bypasses are expressible.
  D8 Sandbox: one test asserts the exact Docker argument vectors DockerCodeRunner builds for run, runAll and checkSyntax (captured with the existing dockerBinary option): network none, memory/cpu/pids bounds, read-only root, no-new-privileges, tmpfs noexec, only per-run temp-directory mounts (source read-only, output the only writable), no home directory, credential, ssh, cloud-config or docker.sock mount, no --privileged or --cap-add or --pid/--network host, and the session worker environment never reaches the container. Real container egress is exercised only if Docker answers (recorded unobserved otherwise).
  D9 Rehearsal: strict forces liveAssistance false at start (loop 1); non-strict: each shown draft increments the hint count on the session row/tombstone (loop 1); this loop adds the optional rehearsalRunId on the scorecard save input and the server-derived hint count (refuses a strictness mismatch, counts none when no session matches, one run id derives once), and proves the session never writes rehearsal_sessions.
  D10 Locality by stage: the answer stage has a device profile; the coding stage and escalation have none (refused with stage_unlisted by the existing rule); code-runner use in device-only is refused unless the host declares the runner device-local (worker option runnerDeviceLocal).

