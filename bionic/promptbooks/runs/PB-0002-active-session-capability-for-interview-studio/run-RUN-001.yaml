notes: |
  ## Operator addendum 2026-10-03: real-call workload profile (added Evidence; no change to the frozen book)

  The operator supplied a real recruiter-screen transcript (about 31 minutes, 11:47:07 to 12:18:15, two speakers, HH:MM:SS timestamps) and asked that it, plus the two stages that follow it (an engineering-manager interview, then a live coding exercise), guide the design. The raw transcript holds a third party's name, an employer, and compensation figures. It is NOT committed and must not be copied into the repo, logs, prompts, or fixtures. Every fixture is a synthetic, anonymised equivalent with the same structure. Agents work from this profile.

  ### What the real call looks like (design and test inputs)

  1. Utterance shape. Segments are speaker-labelled and timestamped; ASR splits one speaker's sentence across several segments, with the other speaker's backchannel ("Mm-hmm", "Yeah.", "Okay.") interleaved mid-sentence. Backchannels and fillers must never open or revise a task and must be coalesced. Source labels (microphone vs application audio) are not verified identities.
  2. Disfluency. The candidate's speech is heavy with fillers and restarts ("kind of", "I guess", "How would I put it?"). Question detection and context assembly must work on this text. Answer drafts are concise and fluent; they never quote fillers.
  3. ASR corrections and errors. Examples: a package audit command heard as another word, a product name heard as a place name, a framework name split in two. Test supersession: a later correcting segment supersedes the earlier one and any answer built on it is marked stale, not silently edited.
  4. Long non-question monologue. The call opens with about three minutes of role description. It is task-less: the assistant waits and shows what is missing, and invents no task. A role description may pre-load context (stack, responsibilities) but only as untrusted observation.
  5. Question mix seen (all must route correctly): motivation for applying; time split across coding, architecture and mentoring; favourite or most recent project story (a compound question: goals, challenges, stack, collaborators, own role); stack familiarity yes/no; best practices for observability and security; describe a microservice you owned (boundaries, failure modes, communication); notice period; reason for leaving the current job and a previous one; compensation expectation; questions for the interviewer.
  6. Compound and follow-up questions. A "part two" follow-up refines the same logical task: the task revision increments and the earlier answer is invalidated or extended, not duplicated. A "put a pin on that, circle back later" utterance leaves a deferred topic in task state.
  7. Grounding hazards found in the call (each becomes a named evaluation case). (a) The candidate affirms a framework the resume lacks ("used it in the last two or three projects"): the assistant must label this as unsupported by the approved matrix revision and never promote it into the matrix or catalogue. (b) Project story facts and metrics must come from matrix entries, not from what was just said aloud. (c) Employer names and dates in "why did you leave" questions are matrix-backed facts; the reason itself is the candidate's own interpretation and must not be generated as a claim, and the draft must not disparage an employer. (d) Compensation and notice period are logistics and negotiation answers: they come only from candidate-set preferences in the approved context, never from a generated number; if absent the session shows what is missing.
  8. Pacing. A recruiter question arrives roughly every 1 to 3 minutes and an answer window is 30 to 90 seconds, so the fast interpret-and-answer operation has a latency budget measured against that. Replay the synthetic fixture at real timing and at 4x, and record p50/p95 from question end to first draft. Coding latency is separate and does not block it.

  ### The next two stages (design for them now)

  - Engineering-manager interview. Expect leadership and behavioural content: mentoring and growing junior developers, code review practice, technical direction and trade-offs, security and scalability ownership, working with product managers and other team leads, hiring and performance, conflict, delivery under pressure, and migration decisions (a document-database to PostgreSQL shift is a stated team theme). The interview policy needs a leadership/behavioural outcome that retrieves approved experience and produces a STAR-shaped, source-backed draft, kept separate from technical-concept answers. Seed synthetic fixtures for these topics.
  - Live coding exercise. The interviewer speaks while the candidate types in a shared editor; constraints arrive and change mid-exercise ("now handle..."). The stack is TypeScript, Node and React. This is slice 2's path: screen.snapshot of a selected window plus transcript, a task revision on each changed constraint, generation into a session-owned Workspace draft with an expected-revision check, code-runner tests, and the three states generated / tests passed / fully verified kept distinct. When the code is already inside Studio, use its structured editor state, not a screenshot. Nothing is typed into or submitted to the interviewer's tool.

  ### Added Evidence (recorded here, not in the book; the book's Evidence and Constraint still pass whole)

  - E-A1. A synthetic, anonymised replay fixture set exists that matches the structure above: segmented and timestamped utterances, backchannels, disfluency, ASR errors and corrections, a long monologue, a compound question with a part-two follow-up, a deferred topic, and one fixture per grounding hazard (7a to 7d). It contains no real names, employers or compensation figures, and a test asserts that.
  - E-A2. The replay runs through the real processor and shows: no task opened by backchannel or monologue; one logical task per question with correct revisions; the unsupported-claim case labelled and not promoted; compensation and notice period drafts drawn only from approved candidate-set context; latency p50/p95 recorded at real timing and 4x.
  - E-A3. A leadership/behavioural policy outcome and an engineering-manager fixture set exist, and a live-coding fixture drives the slice 2 path including a mid-exercise constraint change that invalidates the earlier solution.
  - Each item gets verified / contradicted / unobserved with its command and result token in the dispatch reports, like the book's own Evidence.

  ## Implementation plan #1 (Develop #1, prompt 9)

  Rules implemented (resolved through ADR governs handles). ADR-0010: rule:three-concept-split, rule:versioned-wire-contract, rule:identity-from-credential, rule:credential-ingest-scope, rule:credential-storage, rule:worker-hosted-processor, rule:neutral-core-imports, rule:loop-isolation, rule:tenant-scoped-worker-access, rule:idempotent-observation, rule:idempotent-dispatch, rule:fenced-current-publish, rule:pause-end-suppression, rule:stop-authority. ADR-0011: rule:actor-private-session-rows, rule:composite-owner-references, rule:linked-resource-authorization, rule:immutable-privacy-columns, rule:monotonic-privacy-columns, rule:owner-checked-read-paths, rule:private-session-jobs, rule:private-session-artifact-types, rule:session-claim-setting, rule:claim-writes-lease-and-fence-only, rule:credential-lookup-policy, rule:purge-delete-setting, rule:credential-lifetime-and-renewal, rule:credential-revocation, rule:credential-strength, rule:no-content-after-purging, rule:ingest-membership-recheck, rule:bounded-ingest, rule:id-only-traces, rule:declared-profile-locality, rule:session-processing-policy, rule:device-only-enforced-twice, rule:model-calls-gateway-routed, rule:unlisted-stage-refused, rule:tighten-only-locality, rule:complete-session-purge (jobs and relay rows: see out of scope).
  Out of this loop (dev loops 2-4; recorded, not claimed): interview policy grounding and unsupported-reference rejection; coding path and Workspace publication (rule:no-promotion, rule:job-creation-locked-to-session, rule:action-before-job and rule:no-resume-after-end ship here as database and repository guards but are exercised end to end in loop 2); Studio session UI (rule:inert-draft-rendering); the companion (rule:credential-held-securely, rule:raw-audio-never-persisted); Rehearsal hint wiring (rule:assistance-counts-as-hints; the tombstone hint-count column ships here); the relay-backed device model profile (a device-only answer stage is refused unless a device-declared profile exists, per rule:unlisted-stage-refused).

  Gateway decision (ADR-0010 gateway requirement; no ADR-0002 stop needed): the worker composes its own AiExecutionGateway from @omnitech/ai-runtime plus the provider adapter (apps may import adapters; only agent runtimes are restricted). The shared profile and model configuration source (apps/web/src/platform/ai-config.ts) moves into the existing @omnitech/ai-runtime package as a separate ./config subpath (a node-only host-configuration surface kept out of the browser-safe index), and apps/web imports it from there. No new package; the processor stays in the worker.

  Ordered work units (sequential because they share files; each independently testable; one commit each):
  U1 packages/active-session-contracts (new): package.json, tsconfig.json, src modules and tests. Versioned v1 observation envelopes transcript.final, screen.snapshot, source.disconnected, capture.gap; acknowledgement with control state; control message; credential claims; frozen limit constants (text, screenshot, envelope, per-session counts, ingest rate, session duration cap, credential lifetime, one active session per owner); unknown version or kind rejected; identity fields inside content rejected; validation errors name paths and ids only. scripts/package-boundaries.test.ts gains it in the contract set.
  U2 products/interview/src/backend/live-session/core/ (neutral core, imports only active-session-contracts): ordering, dedup by source and event id returning the original acknowledgement, supersession of corrected segments, task state behind an injected TaskPolicy port, task revisions and staleness, deferred topics, dispatch dedup key (session, task, revision, action kind) with failed, in-flight and succeeded rules, lease and fence model with fenced-current-publish eligibility, status machine with stop authority (created, active, paused, purging, ended). products/interview/package.json gains the dependency; scripts/package-boundaries.test.ts gains a directory-scoped import check naming the core directory. Unit tests.
  U3 locality: packages/ai-contracts (processing policy on requests, policy-refused outcome naming ids only), packages/ai-runtime (AiProfile.locality device, private-network or remote, missing or unknown is remote; the gateway refuses a non-device profile for device-only at resolution and again inside execute, stream, streamStructured, resume and target listing just before dispatch; no fallback; cancel stays allowed), the config move to ai-runtime ./config with locality declared by environment and device requiring a loopback URL, apps/web updated. Spy-adapter tests prove no remote call in device-only; behaviour is unchanged when no policy is supplied.
  U4 agent-job private marker: packages/platform-storage ai schema (immutable private marker, restrictive policy admitting the creator or app.agent_worker, event and artifact rows through the parent job), migration 20261003050000, job repository create with a caller-supplied id and actor-carrying get, cancel, resume and events, apps/web agent-api and the terminal-gateway event route carrying the actor (the service-token route sees no private rows), tests.
  U5 session persistence: products/interview/src/backend/db/live-session.ts (active_sessions, session_observations, session_actions with tenant and owner composite references and forced RLS binding tenant and actor; credential hash and expiry; lease and fence; retention; processing policy; sources snapshot; tombstone with hint count), migration 20261003051000 with immutable, monotonic, link-check and no-content-after-purging triggers, the claim policy (app.session_worker, lease and fence columns only), the credential-lookup policy, the purge delete setting and restrictive session artifact-type policies on platform.artifacts and artifact payloads, and delete blocking of linked interviews, candidacies and profile revisions; drizzle.config.ts schema list; scripts/tenant-context-boundary.test.ts allowlist for the new settings, one owning file each. Security tests on disposable Postgres as the non-owner role.
  U6 repository in products/interview/src/backend/live-session/: start with credential mint (hashed), ingest transaction with dedup and bounds, status transitions, lease acquire, renew and fence increments, fenced writes, owner-scoped stream reads, purge with a final check; the claim, credential-lookup and purge files each own their setting. Database tests.
  U7 processor: ports for claim, repository, policy, gateway and clock; exported through a backend-only product subpath ./session-worker; derives policy from the session row; re-checks locality before dispatch; pause and end suppression; id-only trace sink. Tests with in-memory ports and a spy gateway.
  U8 apps/agent-worker: the session loop registered beside the job loop with per-loop error handling and backoff, lease renewal and fenced writes; main.ts closes shared resources only after both loops settle; an explicit environment allowlist for the Codex and Claude Code runtimes; gateway composition; dependency additions. Tests for loop isolation and two-processor fencing.
  U9 routes mounted in createInterviewBackend ahead of the catch-all: start and control (pause, resume, end, renew credential, tighten locality) and stream under the user's session and tenant membership; ingest under the credential (tenant slug, bounded body, membership recheck, one refusal for unknown, expired or revoked, control state as an acknowledgement field); no credential in a URL or log. Tests including the no-content canary across ingest, dispatch, failure and purge.
  U10 integration pass: cross-cutting evidence tests (same-tenant cross-user for stream, download, context assembly, job result and artifact discovery; two-processor fencing with an expired lease and a refused late publish; dedup; pause and end suppression; locality spies; canary) and gap fixes.

  Risks specific to implementation: drizzle-kit snapshot drift against hand-appended SQL; the application role owns tables, so FORCE RLS and trigger guards must be tested as the non-owner fixture role; moving ai-config changes web imports and tests; the gateway is shared by Presentation and the assistant, so locality defaults must leave current behaviour unchanged; the package-boundary orphan rule between U1 and U2; the existing main.ts closes the database after one loop; the credential must never appear in an error message or URL.

  Quality gates before review: pnpm lint, pnpm format, pnpm typecheck, pnpm test:coverage (the full vitest run including database and RLS suites that use Docker), pnpm build, pnpm verify; scripts/package-boundaries.test.ts and scripts/tenant-context-boundary.test.ts; the repository configures no separate SAST tool, so the RLS suite is the security analysis; verify-code-docs as the declared side effect.

  ## Outcome narrowing #1
  None. Every dispatch receives the book's Outcome, Evidence and Constraint verbatim (file dev1-common.md in the orchestrator scratchpad) plus E-A1..E-A3 as added Evidence; each unit names its slice of the Outcome only as scope, not as a replacement.
