notes: |
  Implementation plan #1: Backend and persistence, in ordered units <= roughly 200 handwritten LOC each.
  1. Strict documents contracts and field validation in packages/interview-contracts/src/documents.ts; unit tests.
  2. Platform artifact metadata policy and controlled nullable owner for tenant-local built-ins in packages/platform-storage/src/schema/platform.ts; preserve existing artifact behavior; SQL migration and security tests.
  3. Size-bounded payload bytes table and narrow repository in platform-storage; tenant-composite artifact FK, forced RLS, owner-scoped read/write; database tests.
  4. Documents-specific member permission and scoped API resolver; ordinary member can write Documents without broad interview.write or artifact.write.
  5. Interview template and immutable template-revision tables with private/built-in policies, artifact links and migration/immutability tests.
  6. Interview document, immutable revision and export tables with same-scope UUID foreign keys where types agree and tenant+actor forced RLS. Existing profile revisions use text tenant/actor keys, so pin and validate profile identity/owner transactionally or use a migration-safe typed bridge; prove cross-member denial.
  7. Nullable candidacy job description and context resolver requiring candidatePersonId = member_people.personId and interview belonging to candidacy.
  8. Bounded DOCX/Markdown template extraction; reject traversal, expansion, external relationships, macros and embedded objects before commit.
  9. Template upload, version, built-in duplication repository; rollback and actor-isolation tests.
  10. Document create/list/revision repository; persist only after successful first generation; pin profile and template revisions.
  11. Exactly one AiExecutionGateway structured call; do not use generateChecked because it can retry. Validate output and authoritative candidacy fields.
  12. Edit, targeted regeneration and restore append full immutable snapshots; stale-revision conflict and historical stability tests.
  13. DOCX and Markdown renderers from selected flat revision; actual file fixtures, split-run placeholder and inert preview tests.
  14. Export bytes persisted as private artifact, safe download headers and history by selected revision; same-tenant other member denied.
  15. Hono Documents API mounted in Interview backend with body/auth/origin limits; end-to-end member route tests.
  Quality gates: targeted package tests and typechecks per unit, schema/migration drift, real PostgreSQL RLS/immutability tests, actual DOCX/Markdown reopen/download, then pnpm verify. Use negative controls for claimed isolation gates. Risks: current artifact RLS is tenant-only; members lack write permissions; shared generateChecked can call AI twice; prototype is sample-only. Preserve Interview behavior, private-content no-log rule, unrelated changes and accepted ADR-0009; no LangGraph.
  Quality gates #1 (final source, 2026-10-02): pnpm verify -> exit 0; lint checked 442 files, format checked 442 files, typecheck 50/50 tasks, full coverage suite 146 files and 1064 tests passed, build 27/27 tasks. pnpm --filter @omnitech/database exec drizzle-kit check -> exit 0, Everything's fine. uv run --no-config crux/scripts/extract-code-docs.py --config bionic/manifest.yml --dry-run -> exit 0, drift false, 361 pages. uv run crux/scripts/derive-arch.py --docs-dir bionic --dry-run -> exit 0, clean true, strict_failures empty; data-model extractor stubbed because it does not support Drizzle. git diff --check -> exit 0 (backend independent reviewer). pnpm audit --audit-level high --json -> exit 1, 18 high and 6 critical repository advisories; none names jszip, whose 3.10.1 version existed in the base lockfile. Security review must assess feature-specific reachability; no claim of a clean repository audit.
  Dev loop #1 review: independent backend reviewer found four MUST-FIX items (unsupported profile facts, artifact orphans on failed links, concurrent duplicate creates, cancellation during first save). Atomic artifact/link transactions, a NULLS NOT DISTINCT selection key, a PostgreSQL blocked-insert cancellation test, and explicit profile field evidence mappings closed them. The reviewer independently reproduced the custom-field failure, reran it after the fix, and found an empty value plus a missing-field validation error; no remaining backend MUST-FIX in focused re-review. Abort after PostgreSQL begins COMMIT cannot be retroactively rolled back.
  Implementation plan #2: Interview Studio Documents UI, using rules in ADR-0009 (Interview ownership, member privacy, one structured gateway call, immutable revisions). Ordered independently testable units: (1) add typed, bounded Documents API client in products/interview/src/frontend/studio/documents/documents-client.ts with same-origin requests and abort support; (2) register Documents view and route in products/interview/src/frontend/studio/config/views.tsx, use-studio-route.ts, manifest.tsx and tokens.css; (3) implement template list, upload/duplicate and server intake field discovery with required/maxLength editing in documents-view.tsx/CSS; (4) implement candidacy/profile/interview/model selection, duplicate Open it and cancellable generation; (5) implement document field editor, local sandboxed preview and validation; (6) implement immutable revision history, stale edit handling, restore and targeted/all/fix regeneration; (7) implement revision-targeted DOCX/Markdown export and stored download list; (8) exercise each flow in documents-view.test.tsx, including A-to-B template switching and field configuration. Risks: stale async template detail, cancellation before save, unsaved preview state, MIME/filename handling, accessibility and field metadata omission. Gates: focused UI Vitest, product TypeScript/Biome, full pnpm verify, doc drift, dependency audit and independent UI/security review. Preserve existing Interview navigation and avoid private content in logs.
  Quality gates #2 (final source, 2026-10-02): pnpm verify -> exit 0; lint 442 files, format 442 files, Turbo typecheck 50/50 tasks, Vitest coverage 146 files and 1064 tests, build 27/27 tasks. pnpm --filter @omnitech/product-interview test -- src/frontend/studio/documents/documents-view.test.tsx -> exit 0, 55 files and 414 tests (independent UI reviewer). uv run --no-config crux/scripts/extract-code-docs.py --config bionic/manifest.yml --dry-run -> exit 0, drift false and 361 pages. uv run crux/scripts/derive-arch.py --docs-dir bionic --dry-run -> exit 0, clean true and strict_failures empty. pnpm --filter @omnitech/database exec drizzle-kit check -> exit 0. git diff --check -> exit 0. pnpm audit --audit-level high --json -> exit 1, 18 high and 6 critical repository advisories; newly declared jszip 3.10.1 existed in HEAD lockfile and is absent from advisory list. Security reviewers must assess relevant paths; no clean audit claim. Release-content scan N/A: no distributed crux skill, agent or template changed.
  Dev loop #2 review: independent UI reviewer found template required/maxLength controls unreachable and stale template-switch upload state. UI fix agent added intake-first field settings plus selected-ID remount and guard; independent re-review found both closed and 414 Interview package tests passed. Live browser flow remains unobserved because persistent migration was not applied to the operator's database.
