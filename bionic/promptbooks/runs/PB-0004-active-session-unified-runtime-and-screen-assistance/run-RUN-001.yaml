notes: |
  Implementation plan (ADR-0016). Rapid-dev: sonnet developers, no commits by agents, orchestrator integrates and runs `pnpm verify`.
  Group A (backend slots, products/interview/src/backend/live-session): per-slot {action id, inflight, child AbortController} replacing run.inflight/openActionId/shared abort in session-run.ts, processor.ts, session-dispatch.ts; idle()/quiesce()/processRun gates read both slots; supersession cancels the slot whose {taskId,revision} fell behind; fenced publication unchanged. Tests via processor-fixture FakeGateway.
  Group B1 (packages + worker): AiTask.attachments (packages/ai-contracts); image-input + toolless capability flags in agent-runtime-contracts, proven by adapter fixture tests (claude + codex forward images, tool-started => typed failure); worker implementation of the existing AgentExecutionPort in apps/agent-worker (tool-less profile, per-attempt ephemeral provider home, staging dir 0700 O_NOFOLLOW removed on settle + startup sweep, typed error codes, policy/standing re-check after capacity wait, live-before-background admission bound) wrapping AgentRuntimeAdapter; ships DISABLED behind config (default noAgents) until PB-0003 executor merges.
  Group C (frontend, products/interview/src/frontend/studio/live): Focus presentation composed from existing result components; floating Document PiP host (mocked documentPictureInPicture in tests) with in-tab fallback, React portal, read-only component set, unmount on 401/404/membership loss/tenant switch/purge/end/pagehide; extend existing store visibility handling so polling continues while either document is visible; Analyze latest capture + typed follow-up controls call a store action (backend endpoint is B2).
  Group B2 (after A and B1): owner-input observation kind (DB CHECK + drizzle migration, DB-only, own source namespace, outside capture caps, negative ingest test that the wire rejects it), owner-input API route + store action wiring, task-revision provenance (speech + snapshot ids + owner input), screenshot loader (observation ids only, owner-session join, media re-detect, digest check, header dimension cap), DispatchPrompt attachments, e2e: transcript + screenshot through real createAiExecutionGateway + AgentExecutionPort with a fake AgentRuntimeAdapter -> assist -> code -> fenced publish; unsupported-vision and device-only refusal; spoken correction supersedes coding; restart replay no duplicate publish.
  Risks: processor.ts reads inflight/openActionId in catch/finally (shared handlers must settle only their own slot); DB-only kind must not enter the wire zod union; PB-0003 may rewrite the executor (keep wrapper thin, test-only).
  Quality gates: `pnpm verify` (lint, format, typecheck, test:coverage, build); real-provider rehearsals are separate *.integration.test.ts and are NOT run here (no provider credentials/time) => reported unobserved.
  Scope checkpoint (ADR-0002): diff vs master is ~22.4k added lines = ~14.5k generated migration snapshot + ~3.9k tests + ~4.1k production; user pre-authorized the full ADR-0016 scope.
  Review security deferrals: [S3/S5 fixed in prompt 11]. Accepted residual [S1/S2]: Codex cannot disable its tools; adapter aborts on first tool-started with read-only sandbox, allowlisted env and empty ephemeral provider home; a hostile screenshot could still try a command (a read-only sandbox can read absolute host paths, exfiltration needs network). Recommendation: prefer the Claude profile (tools: []) for vision sessions. Unobserved: real-provider behaviour.
