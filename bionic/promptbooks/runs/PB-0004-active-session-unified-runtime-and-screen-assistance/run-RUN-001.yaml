pr_draft: |
  ## Summary
  - Active Session can answer from a captured screenshot or a typed follow-up (new owner input), and runs short answers and code in two independent slots so a spoken correction is answered without waiting for obsolete coding.
  - A worker-side `AgentExecutionPort` serves Claude and Codex tool-less and structured, with screenshots staged privately; it ships disabled (`ACTIVE_SESSION_AGENT_PORT=on` to enable).
  - Focus and floating (Document Picture-in-Picture) views present the same session store; the float is read-only and closes on access loss.

  ADR: [[adrs/ADR-0016-run-active-session-assistance-on-the-worker-executor]] (amends ADR-0011). Run: PB-0004 RUN-001.

  ## Test plan
  - [x] `pnpm verify` exit 0 (292 files, 3129 passed, 1 skipped; Docker-backed suites included)
  - [x] End-to-end: real processor + real gateway + real session port with fake Claude- and Codex-shaped adapters (screenshot to answer to code to fenced publish; refusals; device-only; correction supersedes; restart replay; purge; no content in logs)
  - [x] jsdom e2e: Analyze latest capture appears in the Focus view; mocked Document PiP transitions and access-loss unmount
  - [x] DB: owner-input route, observation-kind CHECK pairing, screenshot SQL join, purge
  - [ ] Real Claude and Codex runs with image input; per-provider first-validated-answer latency (needs credentials)
  - [ ] Real-browser Document Picture-in-Picture

  ## Risk notes
  - Adds a migration (`owner.input` observation kind, reserved source id); apply before enabling.
  - Agent-backed assistance is disabled by default. Enabling it keeps provider calls remote: device-only sessions never reach an agent, and a tighten to device-only aborts in-flight remote runs.
  - Codex cannot disable its tools: the adapter aborts on the first tool event under a read-only sandbox and an empty provider home. Prefer the Claude profile for vision sessions.
  - PB-0003 is rewriting the shared executor; `session-agent-port.ts` is a thin interim wrapper keeping `{port, sweep, purge}` so it can be swapped. Expect conflicts in agent-runtime-contracts/adapters and `apps/agent-worker/src/index.ts`.
  - Diff is large (about 4.1k production lines, 3.9k tests, 14.5k generated migration snapshot).
  - ADR-0016 was reviewed by a Claude-only panel, not the OpenRouter multi-model council.

  ## Breaking changes
  None. New optional AiTask.attachments and agent capability flags (absent means false).
summary: |
