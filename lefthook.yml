min_version: 2.1.10
assert_lefthook_installed: true
glob_matcher: doublestar

# Staged-file jobs only. Biome runs on the staged TypeScript, JSON and JavaScript;
# `biome check` fails on lint errors and on formatting, warnings do not fail it
# while the backlog in bionic/inbox/biome-backlog.md is being paid down.
# Swift runs swift-format (layout) and SwiftLint (correctness) on staged .swift files.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "**/*.{ts,tsx,js,jsx,json,jsonc}"
      # Formats and applies the safe fixes to what is staged, and stages the
      # result: a formatting slip is repaired here, never left for the gate.
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: swift-format
      glob: "**/*.swift"
      run: node scripts/swift-format.mjs {staged_files}
    - name: swiftlint
      glob: "**/*.swift"
      run: node scripts/swiftlint.mjs {staged_files}

pre-push:
  commands:
    verify:
      # The full verify, remembered per commit (scripts/verify-gate.mjs): git
      # opens the remote connection before this hook, and an eight-minute gate
      # outlives it. Run the script by hand first; the hook then pushes at once.
      run: node scripts/verify-gate.mjs
