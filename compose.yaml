services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: omnitech
      POSTGRES_USER: omnitech
      POSTGRES_PASSWORD: omnitech
    ports:
      - "5432:5432"
    volumes:
      - omnitech-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnitech -d omnitech"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  omnitech-postgres:
