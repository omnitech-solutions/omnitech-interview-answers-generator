# Interview Studio's local database. `pnpm dev` starts it and waits for it.
name: omnitech-interview

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # The container's administrator; the app connects as `omnitech`.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # A port of its own, clear of other local Postgres servers.
      - "54320:5432"
    volumes:
      - omnitech-postgres:/var/lib/postgresql/data
      - ./docker/postgres/app-role.sql:/docker-entrypoint-initdb.d/app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnitech -d omnitech"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  omnitech-postgres:
