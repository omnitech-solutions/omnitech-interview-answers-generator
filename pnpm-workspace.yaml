packages:
  - apps/*
  - packages/*
  - products/*
  - e2e/*
allowBuilds:
  esbuild: false
  sharp: false
  # tesseract.js's postinstall only prints a funding notice; denied explicitly.
  tesseract.js: false
  tldjs: false

catalog:
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^22.19.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tsx: ^4.21.0
  typescript: ^5.9.3
  vitest: ^4.1.2
  # zod 4.6+ emits a "starts_with" JSON-Schema format that the assistant's ajv rejects; pinned until that validator learns it.
  zod: 4.4.3
